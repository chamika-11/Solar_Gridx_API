# Name of the workflow. You can give any name
name: SOLARGRIDX API CI

on:
  # Run CI when code is pushed to main or any feature branch
  push:
    branches:
      - main
      - dev

  # Run CI when a pull request is created or updated for main
  pull_request:
    branches:
      - main

# A job is a group of steps. its internal key name is: build-test-publish
# display name is Build, Test, and Publish which is visible to user
# it will run on a machine which is a Linux machine ubuntu
jobs:
  build-test-publish:
    name: Build, Test, and Publish
    runs-on: ubuntu-latest

    # steps are the works or tasks done inside a job
    steps:
      # Step 1: Download the repository code
      - name: Checkout source code
        uses: actions/checkout@v5

      # Step 2: Install .NET 8 SDK
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.401"

      # Step 3: Restore dependencies
      - name: Restore dependencies
        run: dotnet restore SolarGridX.Api.csproj

      # Step 4: Build the project in Release mode
      - name: Build project
        run: dotnet build SolarGridX.Api.csproj --configuration Release --no-restore

      # Step 5: Run unit tests
      - name: Run tests
        run: dotnet test tests/SolarGridX.Api.Tests/SolarGridX.Api.Tests.csproj --configuration Release --no-build --verbosity normal

      # Step 6: Publish the API project
      - name: Publish Web API
        run: dotnet publish SolarGridX.Api.csproj --configuration Release --output ./publish --no-build

      # Step 7: Store the publish output as an artifact
      - name: Upload publish artifact
        uses: actions/upload-artifact@v6
        with:
          name: solargridx-api-publish
          path: ./publish
